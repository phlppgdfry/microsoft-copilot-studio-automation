[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "microsoft-copilot-studio-automation"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Approval-bound API and connector assets for Copilot Studio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["automation*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
